<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    <title>Rest custom grabber</title>
    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">
        Rest with Custom Grabber
      </h1>
    </header>

    <div id="result"></div>

    <nav class="flex-container gap between wrap">
      <ul class="point-info">
        <li id="pointer-down">Down at:</li>
        <li id="pointer-move">Move to:</li>
        <li id="pointer-up">Up at:</li>
      </ul>
    </nav>

    <div id="editorEl"></div>

    <script type="module">
      import { Editor } from '../../dist/iink.esm.js'
      import { CustomGrabber } from './custom_grabber.js'
      import { ModalEditorOptions } from '../components/modal/modalEditorOptions.js'
      const editorElement = document.getElementById('editorEl')
      const resultElement = document.getElementById('result')
      const showModalBtn = document.getElementById('showModalBtn')

      let editor

      const editorOptions = {
        configuration: {},
        override: {
          grabber: CustomGrabber
        }
      }

      async function loadEditor(options) {
        resultElement.innerHTML = ''
        await editor?.destroy()
        /**
         * get editor instance from type
         * @param {Element} The DOM element to attach the ink paper
         * @param {Object} The Editor parameters
         */
        editor = await Editor.load(editorElement, 'INKV1', options)

        editor.event.addEventListener('exported', (event) => {
          resultElement.innerHTML =
            event.detail && event.detail['application/vnd.myscript.jiix']
              ? event.detail['application/vnd.myscript.jiix'].label
              : ''
        })
      }

      showModalBtn.addEventListener('click', () => {
        ModalEditorOptions.show(loadEditor, editorOptions)
      })

      ModalEditorOptions.initConfiguration(loadEditor, editorOptions)
    </script>
    <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>

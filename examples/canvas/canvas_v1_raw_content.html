<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <title>Ink Canvas Raw Content</title>

    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />

    <style>
      #result span {
        font-size: small;
        padding: 12px;
      }
    </style>
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">Ink Canvas Raw Content</h1>
    </header>

    <div id="result"></div>

    <nav class="flex-container wrap gap between">
      <div class="flex-container wrap gap">
        <button id="clear" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/clear.svg" />
        </button>
        <button id="undo" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/undo.svg" />
        </button>
        <button id="redo" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/redo.svg" />
        </button>
      </div>
      <select id="language"></select>
    </nav>

    <div id="rootEl"></div>

    <script type="module">
      import { Canvas, getAvailableLanguageList } from '../../dist/iink.esm.js'
      import { ModalCanvasOptions } from '../components/modal/modalCanvasOptions.js'
      const rootElement = document.getElementById('rootEl')
      const resultElement = document.getElementById('result')
      const languageElement = document.getElementById('language')
      const clearElement = document.getElementById('clear')
      const undoElement = document.getElementById('undo')
      const redoElement = document.getElementById('redo')
      const showModalBtn = document.getElementById('showModalBtn')

      let canvas

      undoElement.addEventListener('click', () => {
        canvas?.undo()
      })

      redoElement.addEventListener('click', () => {
        canvas?.redo()
      })

      clearElement.addEventListener('click', () => {
        canvas?.clear()
        resultElement.innerHTML = ''
      })
      const canvasOptions = {
        configuration: {
          recognition: {
            type: 'Raw Content'
          }
        }
      }

      showModalBtn.addEventListener('click', () => {
        ModalCanvasOptions.show(loadCanvas, canvasOptions)
      })

      languageElement.addEventListener('change', (e) => {
        canvasOptions.configuration.recognition.lang = e.target.value
        loadCanvas(canvasOptions)
      })

      async function loadCanvas(options) {
        resultElement.innerHTML = ''
        await canvas?.destroy()

        /**
         * get canvas instance from type
         * @param {Element} The DOM element to attach the ink paper
         * @param {Object} The Canvas parameters
         */
        canvas = await Canvas.load(rootElement, 'INK_V1', options)

        canvas.event.addEventListener('changed', (event) => {
          undoElement.disabled = !event.detail.canUndo
          redoElement.disabled = !event.detail.canRedo
          clearElement.disabled = !event.detail.canClear
        })

        const currentLanguage = canvas.configuration.recognition.lang
        const availableLanguageListResponse = await getAvailableLanguageList(canvas.configuration)
        Object.keys(availableLanguageListResponse.result).forEach((key) => {
          const selected = currentLanguage === key
          languageElement.options[languageElement.options.length] = new Option(availableLanguageListResponse.result[key], key, selected, selected)
        })

        canvas.event.addEventListener('exported', (evt) => {
          const exports = evt.detail
          if (exports && exports['application/vnd.myscript.jiix']) {
            resultElement.innerHTML = `<span>${ JSON.stringify(exports['application/vnd.myscript.jiix'].elements) }</span>`
          } else {
            resultElement.innerHTML = ''
          }
        })
      }

      ModalCanvasOptions.initConfiguration(loadCanvas, canvasOptions)

      /**
       * We expose these objects to the window use it in test
       */
      window.canvasOptions = canvasOptions
      window.loadCanvas = loadCanvas
    </script>
    <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <title>Ink Canvas Diagram</title>

    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />
    <style>
      #conversion-container {
        position: absolute;
        left: 0;
        top: 220px;
      }

      @media only screen and (max-width: 418px) {
        #conversion-container {
          top: 270px;
        }
      }
    </style>
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">
        Ink Canvas Diagram
      </h1>
    </header>
    <div id="result"></div>

    <nav class="flex-container wrap gap between">
      <div class="flex-container wrap gap">
        <button id="clear" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/clear.svg" />
        </button>
        <button id="undo" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/undo.svg" />
        </button>
        <button id="redo" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/redo.svg" />
        </button>
      </div>
      <div class="flex-container wrap gap">
        <button id="pen" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/pen.svg" />
        </button>
        <button id="eraser" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/eraser.svg" />
        </button>
      </div>
      <div class="flex-container wrap gap">
        <div id="preview-container">
          <div id="preview-btn" class="classic-btn">
            <img src="../assets/img/document.svg" />
            <span>Preview</span>
          </div>
          <div id="edit-btn" class="classic-btn" style="display: none">
            <img src="../assets/img/edit.svg" />
            <span>Edit</span>
          </div>
        </div>
      </div>
    </nav>

    <div id="progress"></div>

    <div id="rootEl"></div>

    <div id="conversion-container"></div>

    <script type="module">
      import { Canvas, CanvasTool } from '../../dist/iink.esm.js'
      import { ModalCanvasOptions } from "../components/modal/modalCanvasOptions.js"
      const rootElement = document.getElementById("rootEl")
      const conversionContainer = document.getElementById("conversion-container")
      const resultElement = document.getElementById("result")
      const clearElement = document.getElementById("clear")
      const editButton = document.getElementById("edit-btn")
      const previewButton = document.getElementById("preview-btn")
      const progressElement = document.getElementById("progress")
      const undoElement = document.getElementById("undo")
      const redoElement = document.getElementById("redo")
      const eraserElement = document.getElementById("eraser")
      const penElement = document.getElementById("pen")
      const showModalBtn = document.getElementById("showModalBtn")

      let isPreview = false

      function launchLoader() {
        progressElement.style.transition = " width 10s"
        progressElement.style.opacity = "1"
        progressElement.style.width = `${ rootElement.clientWidth / 2 }px`
      }

      function manageEditMode(withExport) {
        if (!canvas) return
        if (withExport && isPreview && canvas.model.symbols.length > 0) {
          const convertParams = {
            conversionState: "DIGITAL_EDIT",
            mimeTypes: ["image/svg+xml"],
          }
          canvas?.convert(convertParams)
          launchLoader()
        }
        undoElement.disabled = isPreview
        redoElement.disabled = isPreview
        clearElement.disabled = isPreview
        eraserElement.disabled =
          isPreview || canvas.tool === CanvasTool.Erase
        penElement.disabled = isPreview || canvas.tool === CanvasTool.Write
        if (isPreview) {
          conversionContainer.style.visibility = "visible"
          rootElement.style.visibility = "hidden"
        } else {
          conversionContainer.style.visibility = "hidden"
          rootElement.style.visibility = "visible"
        }
      }

      let canvas

      const editorOptions = {
        configuration: {
          recognition: {
            type: "DIAGRAM",
          },
        },
      }

      async function loadEditor(options) {
        isPreview = false
        editButton.style.display = 'none'
        previewButton.style.display = 'flex'
        conversionContainer.innerHTML = ''
        manageEditMode(false)
        resultElement.innerHTML = ""
        await canvas?.destroy()
        /**
         * get canvas instance from type
         * @param {Element} The DOM element to attach the ink paper
         * @param {Object} The Canvas parameters
         */
        canvas = await Canvas.load(rootElement, "INK_V1", options)

        canvas.event.addEventListener("changed", (event) => {
          undoElement.disabled = !event.detail.canUndo || isPreview
          redoElement.disabled = !event.detail.canRedo || isPreview
          clearElement.disabled = !event.detail.canClear || isPreview
          eraserElement.disabled = !event.detail.canClear || canvas.tool === CanvasTool.Erase || isPreview
        })

        canvas.event.addEventListener("exported", (event) => {
          resultElement.innerHTML = JSON.stringify(event.detail || {})
        })

        canvas.event.addEventListener("converted", (evt) => {
          const exports = evt.detail
          if (exports && exports["image/svg+xml"]) {
            progressElement.style.transition = " width 0.3s"
            progressElement.style.width = `${ rootElement.clientWidth }px`
            setTimeout(() => {
              progressElement.style.opacity = "0"
              progressElement.style.width = "0"
            }, 300)
            clearElement.disabled = false
            conversionContainer.innerHTML = exports["image/svg+xml"].trim()
            conversionContainer.firstChild.setAttribute(
              "width",
              rootElement.clientWidth
            )
            conversionContainer.firstChild.setAttribute(
              "height",
              rootElement.clientHeight
            )
            conversionContainer.firstChild.setAttribute(
              "viewBox",
              `0 0 ${ rootElement.clientWidth / 3.77953 } ${ rootElement.clientHeight / 3.77953
              }`
            )
            manageEditMode(false)
          }
        })
      }

      clearElement.addEventListener("click", () => {
        canvas?.clear()
        conversionContainer.innerHTML = ""
      })

      undoElement.addEventListener("click", () => {
        canvas?.undo()
      })

      redoElement.addEventListener("click", () => {
        canvas?.redo()
      })

      eraserElement.addEventListener("click", () => {
        if (!canvas) return
        eraserElement.disabled = true
        penElement.disabled = false
        rootElement.iink.tool = CanvasTool.Erase
        eraserElement.disabled = true
        eraserElement.classList.add("active")
        penElement.disabled = false
        penElement.classList.remove("active")
      })

      penElement.addEventListener("click", () => {
        if (!canvas) return
        eraserElement.disabled = false
        penElement.disabled = true
        rootElement.iink.tool = CanvasTool.Write
        eraserElement.disabled = false
        eraserElement.classList.remove("active")
        penElement.disabled = true
        penElement.classList.add("active")
      })

      previewButton.addEventListener("click", () => {
        if (!canvas) return
        isPreview = true
        previewButton.style.display = "none"
        editButton.style.display = "flex"
        manageEditMode(true)
      })

      editButton.addEventListener("click", () => {
        if (!canvas) return
        isPreview = false
        editButton.style.display = "none"
        previewButton.style.display = "flex"
        manageEditMode(false)
      })
      showModalBtn.addEventListener("click", () => {
        ModalCanvasOptions.show(loadEditor, editorOptions)
      })

      ModalCanvasOptions.initConfiguration(loadEditor, editorOptions)

      /**
       * We expose these objects to the window use it in test
       */
      window.editorOptions = editorOptions
      window.loadEditor = loadEditor
    </script>
    <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>

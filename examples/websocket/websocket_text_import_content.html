<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    <title>Import content</title>
    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">Import content</h1>
    </header>
    <nav class="flex-container wrap between gap">
      <div class="flex-container wrap gap">
        <input type="text" id="importContentField" data-type="text/plain" placeholder="e.g. hello world" />
        <button class="classic-btn" id="importContent">
          Import
        </button>
      </div>
    </nav>

    <div id="editorEl"></div>

    <script type="module">
      import { Editor } from '../../dist/iink.esm.js'
      import { ModalEditorOptions } from '../components/modal/modalEditorOptions.js'
      const editorElement = document.getElementById('editorEl')
      const importContentField = document.getElementById('importContentField')
      const importContentElement = document.getElementById('importContent')
      const showModalBtn = document.getElementById('showModalBtn')

      let editor
      const editorOptions = {
        configuration: {
          recognition: {
            type: 'TEXT'
          }
        }
      }
      async function loadEditor(options) {
        /**
         * get editor instance from type
         * @param {Element} The DOM element to attach the ink paper
         * @param {Object} The Editor parameters
         */
        editor = await Editor.load(editorElement, 'INTERACTIVEINKSSR', options)
      }

      importContentElement.addEventListener('click', () => {
        const value = importContentField.value.replace('\\n', '\n')
        editor?.import(value, importContentField.dataset.type)
      })
      showModalBtn.addEventListener('click', () => {
        ModalEditorOptions.show(loadEditor, editorOptions)
      })

      ModalEditorOptions.initConfiguration(loadEditor, editorOptions)

      /**
       * We expose these objects to the window use it in test
       */
      window.editorOptions = editorOptions
      window.loadEditor = loadEditor
    </script>
    <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>

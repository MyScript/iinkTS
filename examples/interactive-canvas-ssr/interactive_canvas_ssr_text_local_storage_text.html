<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <title>Using local storage</title>

    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />
    <link rel="stylesheet" href="../assets/style/panel.css" />
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="panelToggleBtn" class="btn-panel-toggle" aria-expanded="false" aria-controls="info-panel">
        💡 Info
      </button>
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">Using local storage</h1>
    </header>

    <div class="ex-page-layout">
      <aside id="info-panel" class="ex-panel">
        <p class="ex-panel-heading">💾 Local storage persistence</p>
        <p class="ex-panel-intro">Written text is automatically saved to <code>localStorage</code> after each recognition export.</p>
        <div class="ex-panel-divider"></div>
        <div class="ex-panel-item">
          <div class="ex-panel-item-desc">Refreshing or closing and reopening the page restores the previous content.</div>
        </div>
        <div class="ex-panel-item">
          <div class="ex-panel-item-desc">Saved content persists across sessions — <button id="clear-storage" style="display:inline;padding:1px 8px;font-size:12px;font-weight:600;color:#1976D2;background:rgba(25,118,210,0.08);border:1px solid rgba(25,118,210,0.35);border-radius:4px;cursor:pointer;vertical-align:middle;">clear it</button> to start fresh.</div>
        </div>
      </aside>

      <div id="rootEl"></div>
    </div>

    <script type="module">
      const panelToggleBtn = document.getElementById('panelToggleBtn')
      const infoPanel = document.getElementById('info-panel')
      panelToggleBtn.addEventListener('click', () => {
        const open = infoPanel.classList.toggle('open')
        panelToggleBtn.setAttribute('aria-expanded', open)
      })

      import { Canvas } from '../../dist/iink.esm.js'
      import { ModalCanvasOptions } from '../components/modal/modalCanvasOptions.js'
      const rootElement = document.getElementById('rootEl')
      const clearStorage = document.getElementById('clear-storage')
      const showModalBtn = document.getElementById('showModalBtn')

      let canvas
      const canvasOptions = {
        configuration: {
          recognition: {
            type: 'TEXT',
            text: {
              mimeTypes: ['text/plain']
            }
          }
        }
      }

      async function loadCanvas(options) {
        canvas = await Canvas.load(rootElement, 'INTERACTIVE_INK_SSR', options)

        if (localStorage.textContentToImport) {
          const textContentToImport = localStorage.getItem('textContentToImport')
          canvas.import(textContentToImport, 'text/plain')
        }
      }

      rootElement.addEventListener('changed', (event) => {
        undoElement.disabled = !event.detail.canUndo
        redoElement.disabled = !event.detail.canRedo
      })

      rootElement.addEventListener('exported', (event) => {
        localStorage.setItem('textContentToImport', event.detail['text/plain'])
      })

      clearStorage.addEventListener('click', () => {
        localStorage.removeItem('textContentToImport')
      })

      showModalBtn.addEventListener('click', () => {
        ModalCanvasOptions.show(loadCanvas, canvasOptions)
      })

      ModalCanvasOptions.initConfiguration(loadCanvas, canvasOptions)

      window.canvasOptions = canvasOptions
      window.loadCanvas = loadCanvas
    </script>
    <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>

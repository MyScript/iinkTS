<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <title>Multiple inputs</title>

    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />
    <link rel="stylesheet" href="../assets/style/panel.css" />

    <style>
      main {
        display: flex;
        flex-direction: row;
        gap: 24px;
        padding: 8px 24px;
        padding-bottom: 24px;
        height: calc(100dvh - 165px);
        width: 100%;
        overflow: auto;
      }
      #inputs-colum {
        display: flex;
        flex-direction: column;
        width: calc(100% - 50px);
        min-width: 400px;
      }
      #answers-colum {
        display: flex;
        flex-direction: column;
        width: calc(25% - 24px);
        min-width: 100px;
      }
      .input {
        z-index: 20;
        font-size: 36px;
        margin-bottom: 24px;
        width: 100%;
        height: 140px;
        min-height: 140px;
        border: 1px #bfbfbf solid;
        border-radius: 6px;
        background-color: rgba(174, 174, 174, 0.1);
        cursor: pointer;
      }
      .answer {
        font-size: 18px;
        margin-bottom: 24px;
        padding: 12px;
        width: 100%;
        height: 140px;
        min-height: 140px;
        border: 1px #bfbfbf solid;
        border-radius: 6px;
      }
      .answer.success {
        background-color: rgba(172, 255, 167, 0.2);
      }
      .answer.error {
        background-color: rgba(255, 92, 92, 0.2);
      }
      #rootEl {
        border-radius: 6px;
        background-color: rgba(150, 150, 255, 0.2);
      }
      #validate-answers {
        width: 100%;
      }
    </style>
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="panelToggleBtn" class="btn-panel-toggle" aria-expanded="false" aria-controls="info-panel">
        💡 Info
      </button>
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">
        Multiple text inputs
      </h1>
    </header>

    <div class="ex-page-layout">
      <aside id="info-panel" class="ex-panel">
        <p class="ex-panel-heading">📝 How to answer</p>
        <p class="ex-panel-intro">Click an input area to select it — the background turns <span style="background-color:rgba(150,150,255,0.2);padding:1px 4px;border-radius:2px;">blue</span> when active.</p>
        <div class="ex-panel-divider"></div>
        <div class="ex-panel-item">
          <div class="ex-panel-item-desc">Write your answer in the active input, then click <strong>Validate</strong> to check all answers at once.</div>
        </div>
      </aside>

      <div class="page-content">
        <main>
          <div id="inputs-colum">
          </div>
          <div id="answers-colum">
            <button id="validate-answers" class="classic-btn">Validate</button>
          </div>
        </main>
        <div id="rootEl"></div>
      </div>
    </div>

    <script type="module">
      const panelToggleBtn = document.getElementById('panelToggleBtn')
      const infoPanel = document.getElementById('info-panel')
      panelToggleBtn.addEventListener('click', () => {
        const open = infoPanel.classList.toggle('open')
        panelToggleBtn.setAttribute('aria-expanded', open)
      })
    </script>
    <script src="./interactive_canvas_ssr_text_multiple_inputs.js" type="module"></script>
    <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>

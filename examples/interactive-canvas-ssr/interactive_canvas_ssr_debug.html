<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    <title>Interactive Canvas SSR Text</title>
    <link rel="stylesheet" href="../assets/style/reset.css" />
    <link rel="stylesheet" href="../assets/style/components.css" />
    <link rel="stylesheet" href="../assets/style/examples.css" />
    <link rel="stylesheet" href="../assets/style/inputs.css" />
    <link rel="stylesheet" href="../components/code-viewer/code-viewer.css" />
    <style>
      #specific-logger-level {
        max-height: 500px;
        overflow: auto;
      }
    </style>
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

  <body>
    <header class="header-main">
      <button id="showModalBtn" class="btn-keys">
        API Keys
      </button>
      <h1 class="header-title">
        Interactive Canvas SSR with Debug Logger
      </h1>
    </header>

    <div id="result"></div>

    <nav class="flex-container gap between wrap">
      <div class="flex-container wrap gap">
        <button id="clear" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/clear.svg" />
        </button>
        <button id="undo" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/undo.svg" />
        </button>
        <button id="redo" class="nav-btn btn-fab-mini btn-lightBlue" disabled>
          <img src="../assets/img/redo.svg" />
        </button>
      </div>
      <div class="flex-container wrap gap">
        <label> Global log level: </label>
        <select id="global-logger-level"></select>
        <div class="dropdown-menu">
          <button id="menu-edge" class="menu-button">
            <img src="../assets/img/menu.svg" />
          </button>
          <ul id="specific-logger-level" class="">
            <li>
              <h3>Specific log level</h3>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div id="rootEl"></div>

    <script type="module">
      import {
        Canvas,
        LoggerCategory,
        LoggerLevel
      } from '../../dist/iink.esm.js'
      import { ModalCanvasOptions } from '../components/modal/modalCanvasOptions.js'
      const rootElement = document.getElementById('rootEl')
      const resultElement = document.getElementById('result')
      const globalLoggerLevelSelect = document.getElementById(
        'global-logger-level'
      )
      const specificLggerLevel = document.getElementById(
        'specific-logger-level'
      )
      const clearElement = document.getElementById('clear')
      const undoElement = document.getElementById('undo')
      const redoElement = document.getElementById('redo')
      const showModalBtn = document.getElementById('showModalBtn')

      let canvas
      const loggerConfig = {
      }
      Object.keys(LoggerCategory).forEach((c) => {
        loggerConfig[c] = LoggerLevel.ERROR
      })

      const LOGGER_LEVELS = Object.fromEntries(
        Object.entries(LoggerLevel).filter(([k]) => isNaN(Number(k)))
      )

      Object.entries(LOGGER_LEVELS).forEach(([name, value]) => {
        const selected = value === LoggerLevel.ERROR
        const opt = new Option(name, value, selected, selected)
        globalLoggerLevelSelect.appendChild(opt)
      })

      Object.keys(LoggerCategory).forEach((c) => {
        const li = document.createElement('li')
        li.classList.add('flex-container', 'between', 'gap')
        const label = document.createElement('label')
        label.textContent =
          c.charAt(0).toUpperCase() + c.slice(1).toLocaleLowerCase() + ': '
        li.appendChild(label)

        const select = document.createElement('select')
        select.classList.add('specific-logger-level-input')
        Object.entries(LOGGER_LEVELS).forEach(([name, value]) => {
          const selected = value === LoggerLevel.ERROR
          const opt = new Option(name, value, selected, selected)
          select.appendChild(opt)
        })
        li.appendChild(select)
        select.addEventListener('change', (evt) => {
          loggerConfig[c] = evt.target.value
          canvas.loggerConfiguration = Number(loggerConfig)
        })
        specificLggerLevel.appendChild(li)
      })

      const editorOptions = {
        configuration: {
          recognition: {
            type: 'TEXT'
          },
          logger: loggerConfig
        }
      }

      async function loadEditor(options) {
        /**
         * get canvas instance from type
         * @param {Element} The DOM element to attach the ink paper
         * @param {Object} The Canvas parameters
         */
        canvas = await Canvas.load(rootElement, 'INTERACTIVE_INK_SSR', options)

        canvas.event.addEventListener('changed', (event) => {
          undoElement.disabled = !event.detail.canUndo
          redoElement.disabled = !event.detail.canRedo
          clearElement.disabled = !event.detail.canClear
        })

        canvas.event.addEventListener('exported', (event) => {
          resultElement.innerHTML =
            event.detail && event.detail['application/vnd.myscript.jiix']
              ? event.detail['application/vnd.myscript.jiix'].label
              : ''
        })
      }

      globalLoggerLevelSelect.addEventListener('change', (evt) => {
        if (!canvas) return
        Object.keys(LoggerCategory).forEach((c) => {
          loggerConfig[c] = Number(evt.target.value)
        })
        Array.from(
          document.getElementsByClassName('specific-logger-level-input')
        ).forEach((input) => {
          input.value = evt.target.value
        })
        canvas.loggerConfiguration = loggerConfig
      })

      clearElement.addEventListener('click', async () => {
        canvas?.clear()
      })

      undoElement.addEventListener('click', () => {
        canvas?.undo()
      })

      redoElement.addEventListener('click', () => {
        canvas?.redo()
      })
      showModalBtn.addEventListener('click', () => {
        ModalCanvasOptions.show(loadEditor, editorOptions)
      })

      ModalCanvasOptions.initConfiguration(loadEditor, editorOptions)
    </script>
      <script type="module" src="../components/code-viewer/code-viewer.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>
